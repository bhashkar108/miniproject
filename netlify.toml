[build]
  command = "npx pnpm install --no-frozen-lockfile && cd artifacts/tech-ai && npx pnpm run build"
  publish = "artifacts/tech-ai/dist/public"

[[redirects]]
  from = "/api/*"
  to = "https://techai-api-server.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
