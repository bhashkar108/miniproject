kind = "web"
previewPath = "/"
title = "Tech AI"
description = "A student learning workspace for working through application forms, analyzing study materials, and preparing documents. Form Assistant previews original files and public forms, suggests profile-based answers, and helps students review required information."
version = "1.0.0"
id = "artifacts/tech-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25008

[services.development]
run = "pnpm --filter @workspace/tech-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tech-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/tech-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25008"
BASE_PATH = "/"
