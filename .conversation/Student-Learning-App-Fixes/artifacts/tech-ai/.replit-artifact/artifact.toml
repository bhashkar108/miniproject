kind = "web"
previewPath = "/"
title = "Tech AI Student Assistant"
description = "A student workspace for learning from uploaded documents, practising quizzes, preparing forms, processing documents, and tracking learning progress."
version = "1.0.0"
id = "artifacts/tech-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25008

[services.development]
run = "pnpm --filter @workspace/tech-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tech-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/tech-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25008"
BASE_PATH = "/"
