services:
  # Backend API Server (Node.js/Express)
  - type: web
    name: techai-api-server
    runtime: node
    region: singapore
    plan: free
    rootDir: .
    buildCommand: |
      npm install -g pnpm &&
      pnpm install --frozen-lockfile &&
      cd artifacts/api-server &&
      node ./build.mjs
    startCommand: node artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
    healthCheckPath: /api/healthz

  # Frontend Static Site
  - type: web
    name: techai-frontend
    runtime: static
    region: singapore
    plan: free
    rootDir: .
    buildCommand: |
      npm install -g pnpm &&
      pnpm install --frozen-lockfile &&
      cd artifacts/tech-ai &&
      pnpm run build
    staticPublishPath: artifacts/tech-ai/dist/public
    envVars:
      - key: VITE_API_URL
        fromService:
          name: techai-api-server
          type: web
          property: host
    routes:
      - type: rewrite
        source: /api/*
        destination: https://techai-api-server.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
